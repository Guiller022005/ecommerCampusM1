<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details | Campus Store</title>
    <meta name="description" content="View product specifications, gallery, available sizes, colors, and add to cart at Campus Store.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/detail.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/detail.js" defer></script>
</head>
<body>
    <div class="main-wrapper">
        <main class="main">
            <div class="detail-layout">
                <!-- Left Column: Gallery Carousel -->
                <section id="main__section_gallery" class="main__section">
                    <!-- Populated dynamically with gallery and skeleton -->
                </section>

                <!-- Right Column: Information, Variations and Actions -->
                <div class="product-info-col">
                    <section id="main__section__title" class="main__section">
                        <!-- Populated dynamically with title and score -->
                    </section>

                    <section id="main__section__information" class="main__section">
                        <article class="product__information">
                            <!-- Populated dynamically with description -->
                        </article>
                    </section>

                    <section class="main__section">
                        <article class="product__custom">
                            <!-- Populated dynamically with sizes and colors -->
                        </article>
                    </section>
                </div>
            </div>
        </main>

        <!-- Sticky Add to Cart Footer -->
        <footer id="footer__section__price" class="footer">
            <ul class="footer__ul">
                <!-- Populated dynamically with Add to Cart CTA -->
            </ul>
        </footer>
    </div>
</body>
</html>
